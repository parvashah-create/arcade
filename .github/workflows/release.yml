name: Release plugin assets

on:
  push:
    tags:
      - '*.*.*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag
        run: |
          node -e "const manifest = require('./manifest.json'); if (process.env.GITHUB_REF_NAME !== manifest.version) throw new Error('Tag must exactly match manifest version: ' + manifest.version)"
      - run: npm run check
      - name: Verify release assets
        run: test -s main.js && test -s manifest.json && test -s styles.css
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          name: Monochrome Arcade ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
